# Publicação pelo GitHub Pages. O destino contém somente o jogo.
name: Publicar Operação Zero
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validar-e-preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verificar JavaScript e matemática
        run: |
          node --check assets/js/data.js
          node --check assets/js/core.js
          node --check assets/js/app.js
          node tests/tests.js
      - name: Preparar arquivos do jogo
        run: node scripts/preparar-publicacao.js
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar jogo validado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publicar:
    needs: validar-e-preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
